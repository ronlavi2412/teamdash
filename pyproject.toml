[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "teamdash"
version = "0.1.0"
description = "Generate interactive HTML dashboards of team engineering metrics from GitHub and GitLab"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
teamdash = "teamdash.cli:main"

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests that call real GitHub/GitLab APIs (deselect with '-m \"not e2e\"')",
]
